<style>
:root{--bg:#eef1ee;--ink:#17302e;--cd:#fff;--ac:#0f6b5c;--mu:#5d6f6c;--ln:#cfd8d4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a19;--ink:#e6efed;--cd:#182625;--ac:#4fc3ad;--mu:#9bb0ac;--ln:#2c403d}}
:root[data-theme=dark]{--bg:#101a19;--ink:#e6efed;--cd:#182625;--ac:#4fc3ad;--mu:#9bb0ac;--ln:#2c403d}
html,body{margin:0}body{font-family:Mukta,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:14px}h1{font-size:25px;margin:6px 0}h2{font-size:19px;margin:10px 0 4px}small,.mu{color:var(--mu);font-size:14px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
button,.btn,select,input[type=text]{font:inherit;min-height:48px;border-radius:8px;border:1px solid var(--ln);padding:0 12px;background:var(--cd);color:var(--ink);max-width:100%}
input[type=text]{width:100%;box-sizing:border-box;margin:4px 0 8px}select{margin:4px 0}
button,.btn{display:inline-block;line-height:48px;cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600;margin:4px 4px 4px 0}button.g,.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.ch{color:#fff;border-radius:12px;padding:1px 9px;font-size:14px;font-weight:600;display:inline-block}
.note{font-size:14px;border-left:4px solid var(--ac);padding:4px 10px;background:var(--cd)}
#st{width:100%;aspect-ratio:1;position:relative;overflow:hidden;background:#2b2f2f;touch-action:none;border-radius:8px}
.gr{position:absolute;left:50%;top:50%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);border:2px solid #ffd84d;pointer-events:none}
.gr i{border:1px dashed #ffd84d;display:flex;align-items:center;justify-content:center;text-align:center;font-style:normal}
.gr b{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;font-size:12px;line-height:1.1}.gr em{position:absolute;top:-24px;left:50%;transform:translateX(-50%);color:#ffd84d;font-weight:700;font-style:normal;text-shadow:0 0 3px #000}
.mk{position:absolute;width:15px;height:15px;margin:-7.5px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;font-size:9px;pointer-events:none}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--ln);padding:4px;text-align:left}.sc{overflow-x:auto}
.pg{background:#fff;color:#000;border:1px solid var(--ln);padding:10px;margin:10px 0;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pg th{color:#000}
.bh{display:flex;gap:10px;align-items:center;border-bottom:2px solid #0f6b5c;padding-bottom:6px;margin-bottom:6px;font-size:13px}.bh img{height:60px;width:auto}.bh .nm{font-size:16px}
.ft{display:flex;gap:10px;align-items:center;border-top:1px solid #999;padding-top:6px;margin-top:8px;font-size:11px}.ft img{width:92px;height:92px}
.pl{width:100%;max-width:150mm;display:block;margin:6px auto}.rt td,.rt th{font-size:11px}.lg span{display:inline-block;margin:2px 8px 2px 0;font-size:11px}
@media print{@page{size:A4;margin:8mm}:root,:root:not([data-theme=light]),:root[data-theme=dark]{--bg:#fff;--ink:#000;--cd:#fff;--ln:#999}main{max-width:none;padding:0}.np{display:none!important}body{background:#fff}.pg{border:0;margin:0;padding:0;border-radius:0;break-after:page;page-break-after:always}.pg:last-of-type{break-after:auto;page-break-after:auto}.rt td,.rt th{font-size:10px}}
.rc{position:absolute;box-sizing:border-box;border:2px solid;pointer-events:none}.hd{position:absolute;width:14px;height:14px;margin:-7px;background:#fff;border:2px solid #0f6b5c;pointer-events:none}input[type=range]{width:100%}.up{position:relative;overflow:hidden}.up input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}

:`<b>Room type / खोलीचा प्रकार:</b> choose below, then drag on the plan to draw a box over the room, or tap for a default box. Drag inside to move; drag a corner to resize. The box <b>centre</b> decides the direction. (Entrance: tap the door.) / खोलीवर चौकोन ओढा; चौकोनाचा मध्यबिंदू दिशा ठरवतो.<br> <select onchange="S.pt=this.value">${tyo(S.pt)}</select><br>Placed: <b id=cnt>${f.els.length}</b> <button class=g onclick="const f=S.flats[S.cur];f.els.pop();save();paint($('#st'),f);$('#cnt').textContent=f.els.length">Undo</button><button class=g onclick="const f=S.flats[S.cur];if(S.sel!=null){f.els.splice(S.sel,1);S.sel=null}save();paint($('#st'),f);$('#cnt').textContent=f.els.length">Delete selected</button>`}</div>
<button class=g onclick="go('flats')">Back</button><button onclick="go('conf')">Next: confirm →</button>`;paint($('#st'),f);gest($('#st'),f)}
if(v=='conf'){a.innerHTML=`<h2>${fl(f)} – Confirm / खात्री करा</h2><div id=st></div><p class=mu>Fix any wrong room or zone. / चुकीचे नाव किंवा दिशा दुरुस्त करा.</p>`+(f.els.length?f.els.map((e,j)=>{const L=loc(f,e);return`<div class=c><b>${j+1}.</b> <select onchange="up(${j},'type',this.value)">${tyo(e.type)}</select><br>Zone: <select onchange="up(${j},'zo',this.value)"><option value="">Auto (${ZN[L.z][0]})</option>${zo(e.zo)}</select>${L.out?' <small>⚠ outside grid</small>':''}
${e.type=='ent'?`<br>Wall: <select onchange="up(${j},'wall',this.value)">${opts([['','Auto'],['N','North'],['E','East'],['S','South'],['W','West']],e.wall||'')}</select>`:''}${e.type=='kit'?`<br>Cooking faces: <select onchange="up(${j},'f',this.value)">${opts([['','Not set'],['E','East'],['SE','South-East'],['N','North'],['S','South'],['W','West'],['NE','North-East'],['NW','North-West'],['SW','South-West']],e.f||'')}</select>`:''}${TY[e.type][0]=='bed'?`<br><label><input type=checkbox ${e.at?'checked':''} onchange="up(${j},'at',this.checked)"> Attached toilet+bath / जोडलेले संडास-स्नानगृह</label>`:''}<br><button class=g onclick="S.flats[S.cur].els.splice(${j},1);save();render()">Delete</button></div>`}).join(''):'<p>No rooms placed yet.</p>')+`<button class=g onclick="go('mark')">← Back</button><button onclick="S.flats[S.cur].ok=true;go('rep')">Generate report / अहवाल</button>`;paint($('#st'),f)}
if(v=='rep'){a.innerHTML=pages(f)+`<div class=np><button class=g onclick="go('flats')">Back</button><button class=g onclick="go('conf')">Edit</button><button onclick="window.print()">Print / Save PDF</button><button class=g onclick="go('all')">Print all flats</button><button class=g onclick="go('cmp')">Compare</button></div>`}
if(v=='all'){a.innerHTML=S.flats.filter(x=>x.ok).map(pages).join('')+`<div class=np><button class=g onclick="go('flats')">Back</button><button onclick="window.print()">Print / Save PDF</button></div>`}
if(v=='cmp'){const d=S.flats.filter(x=>x.ok).sort((x,y)=>(x.wing+x.no).localeCompare(y.wing+y.no,0,{numeric:true}));a.innerHTML=`<h1>Comparison / तुलना</h1><div class=sc><table><tr><th>Flat</th><th>Entrance</th><th>Kitchen</th><th>✓✓</th><th>✓</th><th>X</th><th>XX</th></tr>`+d.map(x=>{const rs=x.els.map(e=>({e,r:ev(x,e)})),all=rs.flatMap(y=>y.r),c=k=>all.filter(y=>y.vd==k).length,w=t=>{const q=rs.filter(y=>y.e.type==t);return q.length?V[worst(q.flatMap(y=>y.r))][0]:'–'};return`<tr><td>${x.wing}-${x.no}</td><td>${w('ent')}</td><td>${w('kit')}</td><td>${c(2)}</td><td>${c(1)}</td><td>${c(0)}</td><td>${c(-1)}</td></tr>`}).join('')+`</table></div>${d.length?'':'<p>No reports yet.</p>'}<button class=g onclick="go('flats')">Back</button>`}}

const BH=()=>`<div class=bh><img src="${SW}"><div><b>॥ श्री स्वामी समर्थ ॥</b><br><b class=nm>अनिल कुरकुरे - ज्योतिष व वास्तु</b><br>मो. नं. 99 21 46 37 27 &nbsp;|&nbsp; Instagram- anil_kurkure</div></div>`;
const FT=()=>`<div class=ft><img src="${QR}"><div><b>Instagram: @anil_kurkure</b><br>Based on the supplied Vastu book and positions marked by hand; please double-check. / पुस्तक व हाताने केलेल्या चिन्हांकनावर आधारित; कृपया पुन्हा तपासा.</div></div>`;
function plan(f){const s=1000,M=Math.max(f.nw,f.nh),w=s*f.sc*f.nw/M,h=s*f.sc*f.nh/M,L=s*(.5+f.tx)-w/2,T=s*(.5+f.ty)-h/2,c=s/2,D=['N','NE','E','SE','S','SW','W','NW'];
let o=`<svg class=pl viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"><rect width=1000 height=1000 fill="#2b2f2f"/><image href="${f.img}" x=${L} y=${T} width=${w} height=${h} preserveAspectRatio="none"/>`;
const tx='fill=#fff stroke=#000 stroke-width=5 font-size=26 text-anchor=middle style="paint-order:stroke"';
if(f.meth=='sec'){const R=(f.gw+f.gh)/4*s,a=f.rot*Math.PI/180;let l='',t='';for(let k=0;k<8;k++){const q=a+k*Math.PI/4,e=q+Math.PI/8,z=D[k],X=c+R*.72*Math.sin(q),Y=c-R*.72*Math.cos(q);l+=`<line x1=${c} y1=${c} x2=${c+R*Math.sin(e)} y2=${c-R*Math.cos(e)} />`;t+=`<text x=${X} y=${Y}>${z}</text><text x=${X} y=${Y+26}>${ZN[z][1]}</text>`}
o+=`<g fill=none stroke=#ffd84d stroke-width=4><circle cx=${c} cy=${c} r=${R} /><circle cx=${c} cy=${c} r=${R/3} />${l}</g><g ${tx}>${t}</g>`}
else{const gw=f.gw*s,gh=f.gh*s;let t='';Z.forEach((z,i)=>{t+=`<g transform="translate(${(i%3-1)*gw/3} ${(Math.floor(i/3)-1)*gh/3}) rotate(${-f.rot})"><text y=-2>${z=='C'?'':z}</text><text y=26>${ZN[z][1]}</text></g>`});
o+=`<g transform="translate(500 500) rotate(${f.rot})"><g fill=none stroke=#ffd84d stroke-width=4><rect x=${-gw/2} y=${-gh/2} width=${gw} height=${gh} /><line x1=${-gw/6} y1=${-gh/2} x2=${-gw/6} y2=${gh/2} /><line x1=${gw/6} y1=${-gh/2} x2=${gw/6} y2=${gh/2} /><line x1=${-gw/2} y1=${-gh/6} x2=${gw/2} y2=${-gh/6} /><line x1=${-gw/2} y1=${gh/6} x2=${gw/2} y2=${gh/6} /></g><g ${tx}>${t}<g transform="translate(0 ${-gh/2-14}) rotate(${-f.rot})"><text>N ▲ उत्तर</text></g></g></g>`}
f.els.forEach((e,i)=>{const x=s*(.5+f.tx+f.sc*e.px),y=s*(.5+f.ty+f.sc*e.py),c=V[worst(ev(f,e))][2];if(e.pw){const w=s*f.sc*e.pw,h=s*f.sc*e.ph;o+=`<rect x=${x-w/2} y=${y-h/2} width=${w} height=${h} fill="${c}" fill-opacity=.22 stroke="${c}" stroke-width=4 />`}o+=`<circle cx=${x} cy=${y} r=${e.pw?10:13} fill="${c}" stroke=#fff stroke-width=3 /><text x=${x} y=${y+(e.pw?4:5)} fill=#fff font-size=${e.pw?12:15} font-weight=700 text-anchor=middle>${i+1}</text>`});
return o+'</svg>'}
function pages(f){const rows=f.els.map((e,j)=>({e,j,r:ev(f,e)})).sort((x,y)=>pr(x.e)-pr(y.e)),all=rows.flatMap(x=>x.r),cnt=k=>all.filter(x=>x.vd==k).length;
const meth=f.meth=='sec'?'45° centre &amp; arrows (not the book\'s 3×3 grid)':'3×3 grid (book)';
const p1=`<div class=pg>${BH()}<h2 style="margin:2px 0">${fl(f)}</h2><div style="font-size:12px">North angle / उत्तर कोन: ${Math.round(f.rot)}° &nbsp; Method: ${meth} &nbsp; Date / दिनांक: ${new Date().toLocaleDateString('en-IN')}</div><div class=lg>${[2,1,0,-1,'n'].map(k=>`<span>${chip(k)} ${cnt(k)}</span>`).join('')}</div>${plan(f)}<div class=lg>${f.els.map((e,i)=>`<span><b>${i+1}</b> ${tn(e)[1]} / ${tn(e)[2]}</span>`).join('')}</div>${FT()}</div>`;
let tr='';rows.forEach(({e,j,r})=>r.forEach((x,i)=>{const rem=x.vd==2?'–':x.vd=='n'?'[not covered in book]<br>[पुस्तकात नाही]':x.sr?x.sr[0]+'<br>'+x.sr[1]:'[not covered in book]<br>[पुस्तकात नाही]';
tr+=`<tr><td>${i?'':j+1}</td><td>${x.t[0]}<br>${x.t[1]}</td><td>${ZN[x.zone][0]}<br>${ZN[x.zone][1]}</td><td>${chip(x.vd)}</td><td>${rem}</td><td>${x.p||'–'}</td></tr>`}));
const p2=`<div class=pg>${BH()}<h2 style="margin:2px 0">${fl(f)} – Analysis &amp; remedies / विश्लेषण व उपाय</h2><table class=rt><tr><th>#</th><th>Room / खोली</th><th>Zone / दिशा</th><th>Result / निष्कर्ष</th><th>Remedy / उपाय</th><th>Book</th></tr>${tr||'<tr><td colspan=6>No rooms marked.</td></tr>'}</table><small>Remedies are pyramid remedies from the supplied book; yellow glass/film on south and blue on west windows (p142).<br>दक्षिणेच्या खिडक्यांना पिवळी, पश्चिमेच्या खिडक्यांना निळी काच/फ्लीम (पृ.१४२).</small>${FT()}</div>`;
return p1+p2}
function f_(k,val,id){const f=S.flats[S.cur];f[k]=val;if(id)$('#'+id).textContent=Math.round(val);paint($('#st'),f);save()}
function up(j,k,val){const f=S.flats[S.cur],e=f.els[j];e[k]=val;if(k=='type'){if(val=='ent'){delete e.pw;delete e.ph}else if(!e.pw){e.pw=e.ph=.14/f.sc}}f.ok=false;save();render()}
function addF(){if(!S.series.trim()||!S.wing){S.msg='Enter wing and flat numbers / विंग व क्रमांक लिहा';return render()}S.msg='';parse(S.series).forEach(n=>{if(!S.flats.find(x=>x.wing==S.wing&&x.no==n))S.flats.push({wing:S.wing,no:n,img:null,nw:1,nh:1,rot:0,sc:1,tx:0,ty:0,gw:.8,gh:.8,els:[],ok:false})});S.series='';go('flats')}
function ld(inp,i){S.cur=i;const file=inp.files[0];if(!file)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
const f=S.flats[S.cur];Object.assign(f,{img:c.toDataURL('image/jpeg',.72),nw:c.width,nh:c.height,tx:0,ty:0,sc:1,rot:0,els:[],ok:false});S.mode='adj';go('mark')};im.onerror=()=>{S.msg='Could not read this image';render()};const rd=new FileReader();rd.onload=()=>{im.src=rd.result};rd.readAsDataURL(file)}
addEventListener('resize',()=>{const st=$('#st'),f=S.flats[S.cur];if(st&&f&&f.img)paint(st,f,S.view=='rep')});
S.pt='liv';S.sel=null;S.flats.forEach(f=>f.els.forEach(e=>{if(!e.pw&&e.type!='ent'){e.pw=e.ph=.14/f.sc}}));
if(!S.flats[S.cur])S.view=S.flats.length?'flats':'setup';if(['mark','conf','rep'].includes(S.view)&&!S.flats[S.cur].img)S.view='flats';render();
</script></body></html>
