<style>

<script>
/* ===== EDITABLE RULES (from the supplied book). g order: NW,N,NE,W,C,E,SW,S,SE ; 2=✓✓ 1=✓ 0=X -1=XX null=not marked/mixed ===== */
const Z=['NW','N','NE','W','C','E','SW','S','SE'];
const ZN={NW:['North-West','वायव्य'],N:['North','उत्तर'],NE:['North-East','ईशान्य'],W:['West','पश्चिम'],C:['Centre','मध्य'],E:['East','पूर्व'],SW:['South-West','नैऋत्य'],S:['South','दक्षिण'],SE:['South-East','आग्नेय']};
const ZM={NE:['Most sacred; owner, ethics, dharma; keep clean, no heavy load (p82)','अत्यंत पवित्र; गृहस्वामी, नीती, धर्म; मोठे वजन टाळावे (पृ.८२)'],E:['Ancestors, men and sons, wealth, education, progress (p81)','पितृस्थान; पुरुष व पुत्र, धन, शिक्षण, प्रगती (पृ.८१)'],SE:['Fire; health, fame, marital love (p81)','अग्नी; आरोग्य, कीर्ती, वैवाहिक संबंध (पृ.८१)'],S:['Yama; wealth, happiness, health, eldest son (p81)','यम; धन, सुख, स्वास्थ्य, जेष्ठ पुत्र (पृ.८१)'],SW:['Nirruti; residents\' life and longevity (p81)','निऋती; निवासियांचे जीवन, आयुष्य (पृ.८१)'],W:['Varuna; fame, progress, men\'s place (p82)','वरुण; यश, कीर्ती, प्रगती (पृ.८२)'],NW:['Vayu; relations, business, court cases, daughters\' marriage (p82)','वायू; संबंध, धंदा, कोर्ट-दावे, मुलींचे विवाह (पृ.८२)'],N:['Kubera; mother-place, women\'s health and education (p82)','कुबेर; मातृस्थान, स्त्रियांचे आरोग्य, शिक्षण (पृ.८२)'],C:['Brahmasthan: open, clean, no pit or load (p83)','ब्रह्मस्थळ: खड्डा नको, भाररहीत, स्वच्छ (पृ.८३)']};
const R={
ent:{p:'p21 / p84',g:[],rem:['Entrance in a wrong part: fix 9+9 pyramids on the inner wall, tips up (p142 #28)','मुख्य प्रवेश दरवाजा चुकीच्या भागात असेल तर ९-९ पिरॅमिड आतल्या भिंतीस वरती टोके करून लावावे (पृ.१४२ #२८)']},
liv:{p:'p85 #18',g:[2,1,0,0,0,1,-1,0,-1]},
kit:{p:'p85 #20',g:[1,0,-1,0,0,0,-1,0,2],rem:['Kitchen in a wrong place: 3+3 pyramids, fixed to walls with apex facing the opposite wall (p141 #22)','स्वयंपाकघराचे बाबतही ३-३ पिरॅमिड लावावेत; पिरॅमिड भिंतींना अपेक्स समोरील भिंतीकडे राहील असे फेविकॉलने चिकटविणे (पृ.१४१ #२२)']},
bed:{p:'p85 #21',g:[1,1,0,2,0,0,2,2,0],rem:['Bedroom in a wrong place: 6+6 pyramids (p141 #22)','मास्टर बेड रूम चुकीच्या ठिकाणी असेल तर ६-६ पिरॅमिड लावावी (पृ.१४१ #२२)']},
study:{p:'p85 #22',g:[1,2,1,2,0,1,1,1,0]},store:{p:'p85 #19',g:[1,0,0,1,0,1,1,1,0]},pooja:{p:'p85 #23',g:[0,1,2,0,0,1,-1,0,0]},
bath:{p:'p86 #26',g:[1,1,0,0,-1,2,-1,0,0],rem:['Toilet/bath in a wrong direction: 3+3 pyramids on the two walls facing it (p141 #20)','संडास चुकीच्या दिशेस असेल तर ३-३ पिरॅमिड, त्याच्या दिसणाऱ्या दोन भिंतींना (पृ.१४१ #२०)']},
toil:{p:'p86 #25 (approx. from edge grid)',g:[null,0,-1,1,-1,0,null,null,null],rem:['Toilet in a wrong direction: 3+3 pyramids on the two walls facing it (p141 #20). Door opening to bedroom: 3 pyramids (p142 #24)','संडास चुकीच्या दिशेस असेल तर ३-३ पिरॅमिड (पृ.१४१ #२०); दरवाजा शयनकक्षाकडे उघडत असेल तर ३ पिरॅमिड (पृ.१४२ #२४)']},
stairs:{p:'p86 #27',g:[null,0,0,1,0,0,1,1,null],rem:['Stairs rising in a wrong direction: 3+3 pyramids (p142 #29)','जिना चुकीच्या दिशेने चढ असेल तर ३+३ पिरॅमिड लावणे (पृ.१४२ #२९)']},
safe:{p:'p86 #24',g:[0,0,0,1,0,0,2,1,0]},base:{p:'p87 #31',g:[0,1,1,0,0,1,0,0,0]},meter:{p:'p87 #32',g:[1,null,null,null,null,1,null,null,2]},other:{p:'',g:[]}};
const CK={p:'owner rule (not from book); remedy p142 #27',rem:['Cooking facing a wrong direction: 3 pyramids on the south wall, tips toward the kitchen (p142 #27)','स्वयंपाक चुकीच्या दिशेस तोंड करून करावा लागत असेल तर दक्षिण भिंतीवर ३ पिरॅमिड, टोके स्वयंपाक घराकडे (पृ.१४२ #२७)']};
const TY={ent:['ent','Main entrance','मुख्य प्रवेशद्वार'],kit:['kit','Kitchen','स्वयंपाकघर'],mbed:['bed','Master bedroom','मास्टर बेडरूम'],cbed:['bed','Children bedroom','मुलांची खोली'],gbed:['bed','Guest bedroom','पाहुण्यांची खोली'],bath:['bath','Bathroom','स्नानगृह'],toil:['toil','Toilet','संडास'],liv:['liv','Living room','दिवाणखाना'],pooja:['pooja','Pooja room','देवघर'],stairs:['stairs','Stairs','जिना'],store:['store','Store room','भांडारगृह'],study:['study','Study','अभ्यास कक्ष'],safe:['safe','Safe','तिजोरी'],base:['base','Basement','तळघर'],meter:['meter','Meter board','विद्युत मिटर बोर्ड'],other:['other','Other','इतर']};
const V={2:['Correct','अतिशय योग्य','#1b7a43'],1:['Acceptable','योग्य','#c78a00'],0:['Wrong','चुकीची','#d1342f'],'-1':['Not acceptable','अत्यंत चुकीची','#7a1010'],n:['Not covered in book','[पुस्तकात नाही]','#6b7a77']};
/* ===== APP ===== */
const $=s=>document.querySelector(s);let S={proj:'',wing:'A',series:'',flats:[],cur:0,view:'setup',mode:'adj',pt:'ent'};
try{const x=localStorage.getItem('vastu1');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('vastu1',JSON.stringify(S))}catch(e){}};
const tn=e=>TY[e.type];const fl=f=>`${S.proj||'Project'} – Wing ${f.wing} – Flat ${f.no}`;
function parse(t){let o=[];t.split(',').forEach(p=>{p=p.trim();const m=p.match(/^(\D*?)(\d+)\s*[-–]\s*(\d+)$/);if(m){for(let i=+m[2];i<=+m[3]&&o.length<200;i++)o.push(m[1]+i)}else if(p)o.push(p)});return o}
function go(v,i){if(i!=null)S.cur=i;S.view=v;save();render();scrollTo(0,0)}
function loc(f,e){const x=f.tx+f.sc*e.px,y=f.ty+f.sc*e.py,a=f.rot*Math.PI/180,X=x*Math.cos(a)+y*Math.sin(a),Y=-x*Math.sin(a)+y*Math.cos(a);
if(f.meth=='sec'){const R=(f.gw+f.gh)/4,d=Math.hypot(X,Y),k=((Math.round(Math.atan2(X,-Y)/(Math.PI/4))%8)+8)%8;return{u:X/R,v:Y/R,z:e.zo||(d<R/3?'C':['N','NE','E','SE','S','SW','W','NW'][k]),out:d>R}}
const u=X/f.gw,v=Y/f.gh;
const c=u<-1/6?0:u>1/6?2:1,r=v<-1/6?0:v>1/6?2:1;return{u,v,z:e.zo||Z[r*3+c],out:Math.abs(u)>.5||Math.abs(v)>.5}}
function ev(f,e){const L=loc(f,e),[rk,en,mr]=tn(e),o=[];const add=(t,rr,vd,why)=>o.push({t,zone:L.z,vd,p:rr.p,rem:rr.rem,why});
const gv=(r)=>{const g=R[r].g[Z.indexOf(L.z)];return g==null?'n':g};
if(rk=='ent'){const w=e.wall||(Math.abs(L.v)>Math.abs(L.u)?(L.v<0?'N':'S'):(L.u>0?'E':'W'));const good=(w=='N'||w=='S')?L.u>0:L.v<0;
add([en,mr],R.ent,good?1:0,[`Door on ${w} wall, ${good?'उच्चम (good)':'निचम (bad)'} half (p21)`,`${ZN[w][1]} भिंतीचा ${good?'उच्चम':'निचम'} भाग (पृ.२१)`])}
else if(rk=='other')add([en,mr],R.other,'n',['[not covered in book]','[पुस्तकात नाही]']);
else{add([en,mr],R[rk],gv(rk),ZM[L.z]);
if(rk=='kit'){const fv={SE:2,E:1}[e.f];add(['Cooking facing','स्वयंपाक करताना तोंड'],CK,fv==null?'n':fv,e.f?[`Facing ${ZN[e.f][0]} (owner-supplied rule)`,`${ZN[e.f][1]} दिशेस तोंड (मालकाचा नियम)`]:['Facing not set or other: [not covered in book]','दिशा नाही / इतर: [पुस्तकात नाही]'])}
if(rk=='bed'&&e.at){add(['Attached toilet','जोडलेले संडास'],R.toil,gv('toil'),ZM[L.z]);add(['Attached bathroom','जोडलेले स्नानगृह'],R.bath,gv('bath'),ZM[L.z])}}
return o}
const worst=r=>{const n=r.map(x=>x.vd).filter(x=>x!='n');return n.length?Math.min(...n):'n'};
const pr=e=>({ent:0,kit:1,mbed:2,cbed:2,gbed:2,bath:3,toil:3}[e.type]??4);
const chip=v=>`<span class=ch style="background:${V[v][2]}">${V[v][0]} / ${V[v][1]}</span>`;
function paint(st,f,col){const s=st.clientWidth,M=Math.max(f.nw,f.nh),w=s*f.sc*f.nw/M,h=s*f.sc*f.nh/M;
let o=`<img src="${f.img}" style="position:absolute;max-width:none;pointer-events:none;width:${w}px;height:${h}px;left:${s*(.5+f.tx)-w/2}px;top:${s*(.5+f.ty)-h/2}px">`;
if(f.meth=='sec'){const R=(f.gw+f.gh)/4*s,c=s/2,a=f.rot*Math.PI/180,D=['N','NE','E','SE','S','SW','W','NW'];let g='';for(let k=0;k<8;k++){const t=a+k*Math.PI/4,l=t+Math.PI/8,z=D[k];g+=`<line x1=${c} y1=${c} x2=${c+R*Math.sin(l)} y2=${c-R*Math.cos(l)} /><text x=${c+R*.72*Math.sin(t)} y=${c-R*.72*Math.cos(t)}>${z}<tspan x=${c+R*.72*Math.sin(t)} dy=11>${ZN[z][1]}</tspan></text>`}
o+=`<svg style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 ${s} ${s}" fill=none stroke=#ffd84d stroke-width=2><circle cx=${c} cy=${c} r=${R} /><circle cx=${c} cy=${c} r=${R/3} />${g.replace(/<text.*?<\/text>/g,'')}<g fill=#fff stroke=#000 stroke-width=2.5 font-size=12 text-anchor=middle style="paint-order:stroke">${g.replace(/<line[^>]*>/g,'')}</g></svg>`}else{
o+=`<div class=gr style="width:${f.gw*s}px;height:${f.gh*s}px;transform:translate(-50%,-50%) rotate(${f.rot}deg)"><em style="transform:translateX(-50%) rotate(${-f.rot}deg)">N ▲ उत्तर</em>`+Z.map(z=>`<i><b style="transform:rotate(${-f.rot}deg)">${z=='C'?'':z}<br>${ZN[z][1]}</b></i>`).join('')+'</div>'}
f.els.forEach((e,i)=>{const c=col?V[worst(ev(f,e))][2]:'#0f6b5c';o+=`<span class=mk style="left:${s*(.5+f.tx+f.sc*e.px)}px;top:${s*(.5+f.ty+f.sc*e.py)}px;background:${c}">${i+1}</span>`});st.innerHTML=o}
function gz(f,k){f.gw=Math.min(2,Math.max(.1,f.gw*k));f.gh=Math.min(2,Math.max(.1,f.gh*k));['gwr','ghr'].forEach((id,i)=>$('#'+id)&&($('#'+id).value=i?f.gh:f.gw))}
function gest(st,f){const P=new Map();
st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY})};
st.onpointermove=e=>{const p=P.get(e.pointerId);if(!p||S.mode!='adj')return;const s=st.clientWidth;
if(P.size==1){f.tx+=(e.clientX-p.x)/s;f.ty+=(e.clientY-p.y)/s}else{const q=[...P].find(([k])=>k!=e.pointerId)[1],d0=Math.hypot(p.x-q.x,p.y-q.y),d1=Math.hypot(e.clientX-q.x,e.clientY-q.y);if(d0>5){if(S.pz=='g')gz(f,d1/d0);else{f.sc=Math.min(6,Math.max(.1,f.sc*d1/d0));$('#zm')&&($('#zm').value=f.sc)}}}
p.x=e.clientX;p.y=e.clientY;paint(st,f)};
st.onpointerup=e=>{const p=P.get(e.pointerId);P.delete(e.pointerId);if(S.mode=='plc'&&p&&P.size==0&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<8){const r=st.getBoundingClientRect(),s=r.width;
f.els.push({type:S.pt,px:((e.clientX-r.left)/s-.5-f.tx)/f.sc,py:((e.clientY-r.top)/s-.5-f.ty)/f.sc});f.ok=false;save();paint(st,f);$('#cnt').textContent=f.els.length}};
st.onpointercancel=e=>P.delete(e.pointerId);
st.onwheel=e=>{e.preventDefault();const k=e.deltaY<0?1.1:.9;if(S.pz=='g')gz(f,k);else f.sc=Math.min(6,Math.max(.1,f.sc*k));paint(st,f)}}
const opts=(o,sel)=>o.map(([k,l])=>`<option value="${k}"${k==sel?' selected':''}>${l}</option>`).join('');
const tyo=sel=>opts(Object.entries(TY).map(([k,v])=>[k,v[1]+' / '+v[2]]),sel);
const zo=sel=>opts(Z.map(z=>[z,ZN[z][0]+' / '+ZN[z][1]]),sel);

a.innerHTML=`<h1>${fl(f)}</h1><p class=mu>North angle / उत्तर कोन: ${Math.round(f.rot)}° &nbsp; Method: ${f.meth=='sec'?'45° centre &amp; arrows (not the book\'s 3×3 grid)':'3×3 grid (book)'} &nbsp; Date / दिनांक: ${new Date().toLocaleDateString('en-IN')}</p>${DIS}<div class=c><h2>Summary / सारांश</h2>${[2,1,0,-1,'n'].map(k=>`${chip(k)} ${cnt(k)}<br>`).join('')}<small>Priority order: entrance, kitchen, bedrooms, toilets/baths, rest.</small></div><div id=st></div>`+rows.map(({e,j,r})=>`<div class=c style="border-left:6px solid ${V[worst(r)][2]}"><b>#${j+1} ${tn(e)[1]} / ${tn(e)[2]}</b>`+r.map(x=>`<hr><b>${x.t[0]} / ${x.t[1]}</b> – ${ZN[x.zone][0]} / ${ZN[x.zone][1]}<br>${chip(x.vd)}<br><small>Reason: ${x.why[0]}<br>${x.why[1]}<br>Book: ${x.p||'–'}</small>${[2,'n'].includes(x.vd)?'':`<br><small><b>Remedy / उपाय:</b> ${x.rem?x.rem[0]+'<br>'+x.rem[1]:'[not covered in book] / [पुस्तकात नाही]'}</small>`}`).join('')+'</div>').join('')+`<p class=note>General (p142): yellow glass/film on south windows, blue on west windows.<br>सामान्य: दक्षिणेच्या खिडक्यांना पिवळी, पश्चिमेच्या खिडक्यांना निळी काच/फ्लीम (पृ.१४२).</p><button class=g onclick="go('flats')">Back</button><button class=g onclick="go('conf')">Edit</button><button onclick="window.print()">Print</button><button class=g onclick="go('cmp')">Compare</button>`;paint($('#st'),f,true)}
if(v=='cmp'){const d=S.flats.filter(x=>x.ok).sort((x,y)=>(x.wing+x.no).localeCompare(y.wing+y.no,0,{numeric:true}));a.innerHTML=`<h1>Comparison / तुलना</h1><div class=sc><table><tr><th>Flat</th><th>Entrance</th><th>Kitchen</th><th>✓✓</th><th>✓</th><th>X</th><th>XX</th></tr>`+d.map(x=>{const rs=x.els.map(e=>({e,r:ev(x,e)})),all=rs.flatMap(y=>y.r),c=k=>all.filter(y=>y.vd==k).length,w=t=>{const q=rs.filter(y=>y.e.type==t);return q.length?V[worst(q.flatMap(y=>y.r))][0]:'–'};return`<tr><td>${x.wing}-${x.no}</td><td>${w('ent')}</td><td>${w('kit')}</td><td>${c(2)}</td><td>${c(1)}</td><td>${c(0)}</td><td>${c(-1)}</td></tr>`}).join('')+`</table></div>${d.length?'':'<p>No reports yet.</p>'}<button class=g onclick="go('flats')">Back</button>`}}
function f_(k,val,id){const f=S.flats[S.cur];f[k]=val;if(id)$('#'+id).textContent=Math.round(val);paint($('#st'),f);save()}
function up(j,k,val){const f=S.flats[S.cur];f.els[j][k]=val;f.ok=false;save();render()}
function addF(){if(!S.series.trim()||!S.wing){S.msg='Enter wing and flat numbers / विंग व क्रमांक लिहा';return render()}S.msg='';parse(S.series).forEach(n=>{if(!S.flats.find(x=>x.wing==S.wing&&x.no==n))S.flats.push({wing:S.wing,no:n,img:null,nw:1,nh:1,rot:0,sc:1,tx:0,ty:0,gw:.8,gh:.8,els:[],ok:false})});S.series='';go('flats')}
function ld(inp,i){S.cur=i;const file=inp.files[0];if(!file)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
const f=S.flats[S.cur];Object.assign(f,{img:c.toDataURL('image/jpeg',.72),nw:c.width,nh:c.height,tx:0,ty:0,sc:1,rot:0,els:[],ok:false});S.mode='adj';go('mark')};im.onerror=()=>{S.msg='Could not read this image';render()};const rd=new FileReader();rd.onload=()=>{im.src=rd.result};rd.readAsDataURL(file)}
addEventListener('resize',()=>{const st=$('#st'),f=S.flats[S.cur];if(st&&f&&f.img)paint(st,f,S.view=='rep')});
if(!S.flats[S.cur])S.view=S.flats.length?'flats':'setup';if(['mark','conf','rep'].includes(S.view)&&!S.flats[S.cur].img)S.view='flats';render();
</script></body></html>
